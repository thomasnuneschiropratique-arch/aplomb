    <!--
      Content-Security-Policy — no network beyond the app's own origin (CLAUDE.md rule 3).
      script-src   'wasm-unsafe-eval': MediaPipe and yoga-layout (react-pdf) compile WebAssembly.
                   No 'unsafe-eval': neither MediaPipe, react-pdf nor their dependencies use
                   eval / new Function (checked on a bundle of both).
      worker-src   blob:: fflate's asynchronous API (zip, deflate…) runs in blob: workers.
      style-src    'unsafe-inline': Radix (react-remove-scroll) injects <style> elements.
      img/media    blob:: photos and videos stored in IndexedDB; data:: small inlined assets.
      connect-src  blob: data:: fetch() on object URLs / data URLs (canvas, PDF assets).
      frame-src    blob:: PDF preview.
      The dev server adds 'unsafe-inline' (React Refresh preamble) and ws:/wss: (HMR) — see
      devCspRelaxation() in vite.config.ts. Never add them here.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; child-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; font-src 'self'; connect-src 'self' blob: data:; frame-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'" />
